<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meus Gastos</title>
    <link rel="stylesheet" href="/frontend/css/style.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@300..700&display=swap" rel="stylesheet">
</head>
<body>
    <main>
        <div class="model">

            <div class="model-sec-1">

                <div class="section-1">
                    <h1>Meu orçamento 💸</h1>
                    <p>Organize sua renda e seus gastos do mês.</p>
                </div>

                <div class="section-2">
                    <a>Renda mensal<br> R$</a>
                    <input type="number" placeholder="0,00" id="input-renda" class="input-renda">
                </div>

                <div class="gastos">
                    <a>Gastos</a>
                    <input type="button" value="+ Adicionar gastos" id="abrirFormulario" class="input-gastos">
                </div>

                <div id="overlay" class="formulario-gastos">
                    <div id="formulario">

                        <div class="header-forms">
                            <h2>Adicionar gastos</h2>
                            <a id="fecharFormulario">x</a>
                        </div>
                        
                        <div id="container"></div>

                        <button id="adicionarGastos">Adicionar</button>
                        <button id="salvarFormulario">Salvar</button>
                    </div>
                </div>

            </div>

            <div class="model-part-2">
                <div class="calcular">
                    <input type="button" value="Calcular" class="button-calcular">
                </div>
            </div>
        </div>
    </main>
    <footer>

    </footer>
    <script src="/frontend/js/overlay.js"></script>
    <script src="/frontend/js/addExpenses.js"></script>
</body>
</html>
